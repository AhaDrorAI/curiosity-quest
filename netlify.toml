# Netlify settings for Curiosity Quest.
# Netlify builds the site from GitHub on every push to the main branch.
[build]
  command = "npm run build"
  publish = "dist"

# The build server has no browser: reuse the committed share image and don't download one.
[build.environment]
  NODE_VERSION = "22"
  SKIP_OG_IMAGE = "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Safety and privacy headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Only this site's own files may run. Map tiles from Esri / OpenStreetMap are allowed as images,
    # because the geography activity can show them when a visitor picks those map styles.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'"

# Fonts and illustrations rarely change: let browsers keep them for a week
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
