<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 289" role="img" aria-label="Planets circling the Sun">
  <style>
    
    .orbit { transform-origin: 200px 150px; animation-name: spin; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tw { animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .glow { animation: pulse 5s ease-in-out infinite; transform-origin: 200px 150px; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
